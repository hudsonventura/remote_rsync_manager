
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsync-manager-server
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:5001
      - CLIENT_DEV_MODE=false
      - STORE_PATH=/store
      - HOST_PATH=/host
    restart: unless-stopped
    volumes:
      - ./data/:/app/data/
      # Mount the file system you want to backup, but use the file docker-compose-override.yml
      # DO: cp docker-compose-override.example.yml docker-compose-override.yml
      # Now edit the docker-compose-override.yml and put all of your diretories that you need

    

